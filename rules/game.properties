# RinkDesk competition rules — game events
#
# Your local override for goal and penalty types. This file ships empty on
# purpose: the built-in list lives in the image. Add a line here only to
# append a new type or change an existing one. Missing keys fall back to the
# built-in default, so it is safe to leave this file empty.
#
# Format:  key = value
# Comments start with # or ;. Blank lines are ignored.
#
# Penalty types are one `penalty.CODE=minutes` line each. Each line you add
# here APPENDS a new penalty type; a line that repeats a built-in code only
# changes its minutes. `minutes` is the duration the desk records for that
# code: a whole number, `1:30`, `2+2`, or `GP`.
#
# Goal types are a single comma-separated list. Because it is one key, adding
# a goal type means re-listing the whole list. The built-in list is:
#   EQ,PP,SH,EN,PS,OT,SO,SOM
#
# --- Examples -------------------------------------------------------------
#
# Add a spearing penalty (2 minutes):
#   penalty.SPEARING=2
#
# Add a game-winner goal type to the built-in list:
#   goalTypes=EQ,PP,SH,EN,PS,OT,SO,SOM,GW
#
# Change how long a hooking penalty lasts:
#   penalty.HOOK=4
#
# --- Nationalized labels --------------------------------------------------
#
# A new code shows in the desk by its raw short code until you also add a
# nationalized label. Do it in the three desk locale files (part of the web
# image, so a new label needs a rebuild of that image):
#
#   app/web/js/locales/pl.js
#   app/web/js/locales/en.js
#   app/web/js/locales/cs.js
#
#   - a goal type:
#       goalType: { GW: 'Game-winner', ... }   (full name, picker)
#       goalTypeShort: { GW: 'Winner', ... }   (short, live page)
#   - a penalty type:
#       penaltyType: { SPEARING: 'Spearing', ... }
#
# The file is re-read when it changes on disk; you can also press
# "Refresh game rules data" in Settings → Game.
