# RinkDesk competition rules — game events
#
# Goal and penalty types offered by the desk. Goal types are a comma-separated
# list of official short codes. Penalty types are one `penalty.CODE=minutes`
# entry each; minutes is the duration the desk records for that code. Add or
# remove lines to change what the desk offers. Any duration the helpers
# understand is accepted: whole numbers, `1:30`, `2+2`, or `GP`.
#
# Format:  key = value
# Comments start with # or ;. Blank lines are ignored. Missing or invalid keys
# fall back to the built-in default.
#
#
# --- How to add a new goal or penalty type -------------------------------
#
# The official short code alone is not enough to show a name in the desk: the
# picker prints the code plus a nationalized label. Do it in two steps:
#
#   1. Define the code here:
#        - a goal type: add it to the `goalTypes` list above, e.g. `GW` in
#          `goalTypes=EQ,PP,SH,EN,PS,OT,SO,SOM,GW`.
#        - a penalty type: add a line below, e.g. `penalty.SPEARING=4`.
#   2. Add the nationalized label to the three locale files (desk frontend):
#        app/web/js/locales/pl.js
#        app/web/js/locales/en.js
#        app/web/js/locales/cs.js
#      - a goal type:
#            goalType: { GW: 'Game-winner', ... }         (full name, picker)
#            goalTypeShort: { GW: 'Winner', ... }         (short, live page)
#      - a penalty type:
#            penaltyType: { SPEARING: 'Spearing', ... }
#      Without a label the desk still works and shows the raw code.
#
# The rules file is re-read on demand: after editing it, press
# "Refresh game rules data" in Settings → Game. Locale files are part of the
# web image, so a new label needs a rebuild of that image.


goalTypes=EQ,PP,SH,EN,PS,OT,SO,SOM


penalty.HOOK=2
penalty.TRIP=2
penalty.HOLD=2
penalty.SLASH=2
penalty.ROUGH=2
penalty.BOARD=2
penalty.TOO-MANY=2
penalty.FIGHT=5
penalty.MISC=10
penalty.GAME=GP
