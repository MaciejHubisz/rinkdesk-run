# RinkDesk competition rules — classification
#
# Your local override for scoring values. This file ships empty on purpose:
# the built-in values live in the image. Add a line here only to change one.
# Missing keys fall back to the built-in default, so it is safe to leave this
# file empty.
#
# Format:  key = value
# Comments start with # or ;. Blank lines are ignored.
#
# Point values are whole numbers.
#
# --- Keys and built-in defaults ------------------------------------------
#
# points.regulationWin=3   win in regulation
# points.overtimeWin=2     win in overtime or shootout
# points.overtimeLoss=1    loss in overtime or shootout
# points.regulationLoss=0  loss in regulation
# points.walkoverWin=3     walk-over win
# points.walkoverLoss=0    walk-over loss
#
# --- Examples -------------------------------------------------------------
#
# Award 2 points for a regulation win instead of 3:
#   points.regulationWin=2
#
# Give no point for an overtime loss:
#   points.overtimeLoss=0
#
# The file is re-read when it changes on disk — no rebuild or restart needed.
