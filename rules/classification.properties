# RinkDesk competition rules — classification
#
# Points awarded for each result. Edit this file to change how games are
# scored; no code changes or rebuild are needed. The backend re-reads the file
# whenever it changes on disk.
#
# Format:  key = value
# Comments start with # or ;. Blank lines are ignored. Any key that is missing
# or invalid falls back to the built-in default, so it is safe to delete lines.
#
# Point values are whole numbers.


# Regulation (60-minute) win.
points.regulationWin=3
# Win decided in overtime or a shootout.
points.overtimeWin=2
# Loss decided in overtime or a shootout.
points.overtimeLoss=1
# Regulation (60-minute) loss.
points.regulationLoss=0
# A walk-over is a played game: the opponent gets these points and a win.
points.walkoverWin=3
# The side that forfeited gets these points and a loss.
points.walkoverLoss=0
