# RinkDesk competition rules — table ordering
#
# Your local override for tie-break and leader-board sort order. This file
# ships empty on purpose: the built-in order lives in the image. Add a line
# here only to change one. Missing keys fall back to the built-in default, so
# it is safe to leave this file empty.
#
# Format:  key = value
# Comments start with # or ;. Blank lines are ignored.
#
# An order value is a comma-separated list of `field:direction` entries, most
# important first. `direction` is asc or desc; a field may be a sum, e.g.
# `so+som`. Numeric fields: gp w otw otl l gf ga gd pts pim pen gm g a a1 a2
# gwg first eq pp sh en ps ot so som soSaves soConceded. Text fields: name
# team teamShort short nickname.
#
# --- Keys ----------------------------------------------------------------
#
# standings.order          league table tie-break
# stats.scorers.order      full-season points board
# stats.goals.order        full-season goals board
# stats.assists.order      full-season assists board
# stats.penalties.order    full-season penalties board
# stats.overtime.order     overtime scorers
# stats.shootout.order     shootout scorers
# stats.goalies.order      shootout goalies
# leaders.goals.order      dashboard top goals
# leaders.assists.order    dashboard top assists
# leaders.points.order     dashboard top points
# leaders.pp.order         dashboard top power-play goals
# leaders.pim.order        dashboard top penalty minutes
# leaders.gm.order         dashboard top game misconducts
#
# --- Examples -------------------------------------------------------------
#
# Break table ties by wins before goal difference:
#   standings.order=pts:desc,w:desc,gd:desc,gf:desc,name:asc
#
# Order the points board by goals first:
#   stats.scorers.order=g:desc,pts:desc,name:asc
#
# The file is re-read when it changes on disk — no rebuild or restart needed.
