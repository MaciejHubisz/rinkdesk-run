# RinkDesk competition rules
#
# This is the host copy used by docker-compose (bind-mounted read-only over the
# default baked into the backend image). Edit it here and restart the stack, or
# just save — the backend picks up changes on the next request.
#
# All scoring and table-ordering rules live in this file. Edit it to change how
# points are awarded and how tables are sorted; no code changes or rebuild are
# needed. The backend re-reads the file whenever it changes on disk.
#
# Format:  key = value
# Comments start with # or ;. Blank lines are ignored. Any key that is missing
# or invalid falls back to the built-in default, so it is safe to delete lines.
#
# Point values are whole numbers. Order rules are a comma-separated list of
# field:direction entries, most important first. `direction` is asc or desc.
# A field may be a sum, e.g. `so+som`. Numeric fields: gp w otw otl l gf ga gd
# pts pim pen gm g a a1 a2 gwg first eq pp sh en ps ot so som soSaves
# soConceded. Text fields: name team teamShort short nickname.


# --- Points awarded for each result ----------------------------------------
# Regulation (60-minute) win.
points.regulationWin=3
# Win decided in overtime or a shootout.
points.overtimeWin=2
# Loss decided in overtime or a shootout.
points.overtimeLoss=1
# Regulation (60-minute) loss.
points.regulationLoss=0
# A walk-over is a played game: the opponent gets these points and a win.
points.walkoverWin=3
# The side that forfeited gets these points and a loss.
points.walkoverLoss=0


# --- Standings table order -------------------------------------------------
# Tie-break order for the league table. Default: points, goal difference,
# goals scored, then team name.
standings.order=pts:desc,gd:desc,gf:desc,name:asc


# --- Statistics boards order ----------------------------------------------
# Full season boards (standings page).
stats.scorers.order=pts:desc,g:desc,a1:desc,name:asc
stats.goals.order=g:desc,pts:desc,gwg:desc,name:asc
stats.assists.order=a:desc,a1:desc,pts:desc,name:asc
stats.penalties.order=pim:desc,gm:desc,pen:desc,name:asc
stats.overtime.order=ot:desc,name:asc
stats.shootout.order=so+som:desc,so:desc,name:asc
stats.goalies.order=soSaves:desc,soConceded:asc,name:asc


# --- Dashboard top-five leader boards -------------------------------------
# Only the best five players of each category are shown.
leaders.goals.order=g:desc,pts:desc,name:asc
leaders.assists.order=a:desc,pts:desc,name:asc
leaders.points.order=pts:desc,name:asc
leaders.pp.order=pp:desc,pts:desc,name:asc
leaders.pim.order=pim:desc,pts:desc,name:asc
leaders.gm.order=gm:desc,pts:desc,name:asc
