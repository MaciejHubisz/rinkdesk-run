# Pre-built images only. No source, schema, or dumps in this folder.
# Image prefix/tag come from .env.
name: rinkdesk

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: rinkdesk
      POSTGRES_PASSWORD: rinkdesk
      POSTGRES_DB: rinkdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinkdesk -d rinkdesk"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    image: ${RINKDESK_IMAGE_PREFIX:-ghcr.io/maciejhubisz/rinkdesk}-backend:${RINKDESK_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://rinkdesk:rinkdesk@db:5432/rinkdesk
      RINKDESK_HOST: 0.0.0.0
      RINKDESK_PORT: "8765"
    # App configuration (Uno overlay ids, live refresh, viewer stats, file
    # paths, ...) ships with defaults baked into the image; drop a RINKDESK_*
    # override in .env to change one without rebuilding.
    env_file:
      - .env
    volumes:
      # Scoring, table-ordering and game rules, editable on the host without a
      # rebuild.
      - ./rules:/app/rules:ro${RINKDESK_VOL_OPTS_RO:-}
      # Host ./exports by default; --export-path picks another host folder.
      # SOURCE vars are set by start.sh; named *_SOURCE so podman-compose does
      # not confuse them with the in-container RINKDESK_*_PATH app variables.
      # RINKDESK_VOL_OPTS is ":z" for SELinux relabelling on Linux.
      - "${RINKDESK_EXPORTS_SOURCE:-./exports}:/app/exports${RINKDESK_EXPORTS_OPTS:-}"
      # Host ./protocols by default; --protocols-path picks another host folder.
      - "${RINKDESK_PROTOCOLS_SOURCE:-./protocols}:/app/protocols${RINKDESK_PROTOCOLS_OPTS:-}"
      # Staging folder for imports (drop exported JSON files here) and the
      # committed demo dataset.
      - ./import:/app/import${RINKDESK_VOL_OPTS:-}
      - ./demo:/app/demo:ro${RINKDESK_VOL_OPTS_RO:-}
      # License-bank archive (RinkDesk-specific) and team logo images.
      - ./licenses:/app/licenses${RINKDESK_VOL_OPTS:-}
      - ./graphics/logos:/app/graphics/logos${RINKDESK_VOL_OPTS:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  backup:
    # Hourly gzipped pg_dump into auto-backups/, last 48 h kept. Only this
    # container mounts that folder, so the desk can neither list nor delete it,
    # and --force-recreate (which wipes the database) leaves it alone.
    image: docker.io/library/postgres:16-alpine
    init: true
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: rinkdesk
      PGPASSWORD: rinkdesk
      PGDATABASE: rinkdesk
      BACKUP_EVERY_SECONDS: "${RINKDESK_BACKUP_EVERY_SECONDS:-3600}"
      BACKUP_KEEP_MINUTES: "${RINKDESK_BACKUP_KEEP_MINUTES:-2880}"
    volumes:
      - ./auto-backups:/backups${RINKDESK_VOL_OPTS:-}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -o pipefail
        while :; do
          name="rinkdesk-auto-$$(date -u +%Y%m%d-%H%M%S).sql.gz"
          if pg_dump --clean --if-exists --no-owner | gzip > "/backups/.$$name"; then
            mv "/backups/.$$name" "/backups/$$name"
          else
            rm -f "/backups/.$$name"
            echo "backup failed, next try in $$BACKUP_EVERY_SECONDS s" >&2
          fi
          find /backups -name 'rinkdesk-auto-*.sql.gz' -mmin "+$$BACKUP_KEEP_MINUTES" -delete
          sleep "$$BACKUP_EVERY_SECONDS"
        done

  web:
    image: ${RINKDESK_IMAGE_PREFIX:-ghcr.io/maciejhubisz/rinkdesk}-web:${RINKDESK_IMAGE_TAG:-latest}
    ports:
      - "${RINKDESK_PORT:-8765}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    name: rinkdesk-pg
