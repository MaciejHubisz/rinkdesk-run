# Pre-built images only. No source, schema, or dumps in this folder.
# Image prefix/tag come from .env.
name: rinkdesk

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: rinkdesk
      POSTGRES_PASSWORD: rinkdesk
      POSTGRES_DB: rinkdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinkdesk -d rinkdesk"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    image: ${RINKDESK_IMAGE_PREFIX:-docker.io/maciejhubisz/rinkdesk}-backend:${RINKDESK_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://rinkdesk:rinkdesk@db:5432/rinkdesk
      RINKDESK_HOST: 0.0.0.0
      RINKDESK_PORT: "8765"
      RINKDESK_LIVE_REFRESH_SECONDS: "${RINKDESK_LIVE_REFRESH_SECONDS:-5}"
      RINKDESK_LIVE_CACHE_SECONDS: "${RINKDESK_LIVE_CACHE_SECONDS:-5}"
      RINKDESK_DEFAULT_SNAPSHOT: /app/database/default-snapshot.json
      RINKDESK_CUSTOM_SNAPSHOT: /app/exports/whole-application-data-export.json
      RINKDESK_SNAPSHOT_ARCHIVE: /app/exports/archive
      RINKDESK_DEFAULT_LICENSES: /app/database/default-licenses.json
      RINKDESK_CUSTOM_LICENSES: /app/exports/licenses-export.json
      RINKDESK_PROTOCOLS_PATH: /app/protocols
      RINKDESK_TEAM_LOGOS: /app/team-logos
    volumes:
      # Named volume by default; --export-path bind-mounts a host folder instead.
      # SOURCE vars are set by start.sh; named *_SOURCE so podman-compose does
      # not confuse them with the in-container RINKDESK_*_PATH app variables.
      # RINKDESK_VOL_OPTS is ":z" for SELinux relabelling on Linux.
      - "${RINKDESK_EXPORTS_SOURCE:-exports}:/app/exports${RINKDESK_EXPORTS_OPTS:-}"
      # Host ./protocols by default; --protocols-path picks another host folder.
      - "${RINKDESK_PROTOCOLS_SOURCE:-./protocols}:/app/protocols${RINKDESK_PROTOCOLS_OPTS:-}"
      # Team logo images live in ./team-logos; export/import writes them here too.
      - ./team-logos:/app/team-logos${RINKDESK_VOL_OPTS:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    image: ${RINKDESK_IMAGE_PREFIX:-docker.io/maciejhubisz/rinkdesk}-web:${RINKDESK_IMAGE_TAG:-latest}
    ports:
      - "${RINKDESK_PORT:-8765}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    name: rinkdesk-pg
  exports:
    name: rinkdesk-exports
