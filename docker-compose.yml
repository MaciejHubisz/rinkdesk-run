# Pre-built images only. No source, schema, or dumps in this folder.
# Image prefix/tag come from .env (written when the maintainer pushes).
name: rinkdesk

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: rinkdesk
      POSTGRES_PASSWORD: rinkdesk
      POSTGRES_DB: rinkdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinkdesk -d rinkdesk"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    image: ${RINKDESK_IMAGE_PREFIX:-docker.io/maciejhubisz/rinkdesk}-backend:${RINKDESK_IMAGE_TAG:-1.0.0}
    environment:
      DATABASE_URL: postgresql://rinkdesk:rinkdesk@db:5432/rinkdesk
      RINKDESK_HOST: 0.0.0.0
      RINKDESK_PORT: "8765"
      RINKDESK_VERSION: "${RINKDESK_VERSION:-1.0.0}"
      RINKDESK_COMMIT: "${RINKDESK_COMMIT:-release}"
      RINKDESK_RUN_COMMIT: "${RINKDESK_RUN_COMMIT:-}"
      RINKDESK_DEFAULT_SNAPSHOT: /app/database/default-snapshot.json
      RINKDESK_CUSTOM_SNAPSHOT: /app/exports/whole-application-data-export.json
      RINKDESK_SNAPSHOT_ARCHIVE: /app/exports/archive
      RINKDESK_DEFAULT_LICENSES: /app/database/default-licenses.json
      RINKDESK_CUSTOM_LICENSES: /app/exports/licenses-export.json
      RINKDESK_PROTOCOLS_PATH: /app/protocols
    volumes:
      # Named volume by default; --export-path bind-mounts a host folder instead.
      - "${RINKDESK_EXPORTS_PATH:-exports}:/app/exports${RINKDESK_EXPORTS_OPTS:-}"
      # Named volume by default; --protocols-path bind-mounts a host folder instead.
      - "${RINKDESK_PROTOCOLS_PATH:-protocols}:/app/protocols${RINKDESK_PROTOCOLS_OPTS:-}"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    image: ${RINKDESK_IMAGE_PREFIX:-docker.io/maciejhubisz/rinkdesk}-web:${RINKDESK_IMAGE_TAG:-1.0.0}
    ports:
      - "${RINKDESK_PORT:-8765}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    name: rinkdesk-pg
  exports:
    name: rinkdesk-exports
  protocols:
    name: rinkdesk-protocols
